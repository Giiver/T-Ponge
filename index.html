<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Application de prise de commandes hors-ligne pour foires" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="T-Ponge Orders" />
    
    <!-- Responsive viewport for mobile and kiosk mode -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/masked-icon.svg" color="#2563eb" />
    
    <title>T-Ponge Commandes Foire</title>
    
    <style>
      /* Prevent pull-to-refresh but allow scrolling */
      body {
        overscroll-behavior-y: none; /* Prevent pull-to-refresh */
        overscroll-behavior-x: none; /* Prevent horizontal bounce */
        -webkit-overflow-scrolling: touch;
      }
      
      /* Desktop kiosk mode - prevent scrolling */
      @media (min-width: 769px) {
        body {
          overflow: hidden;
        }
        
        #root {
          height: 100vh;
        }
      }
      
      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1e293b;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #64748b;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <h2>T-Ponge Commandes</h2>
      <p>Chargement de l'application...</p>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.5s ease';
            setTimeout(() => loading.remove(), 500);
          }
        }, 1000);
      });
      
      // Prevent context menu on long press (kiosk mode)
      document.addEventListener('contextmenu', e => e.preventDefault());
      
      // Prevent text selection
      document.addEventListener('selectstart', e => e.preventDefault());
      
      // Prevent drag and drop
      document.addEventListener('dragstart', e => e.preventDefault());
    </script>
  </body>
</html>
